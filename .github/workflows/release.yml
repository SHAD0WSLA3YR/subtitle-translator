name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Force CPU defaults for portable build
        shell: pwsh
        run: |
          (Get-Content config.yaml) `
            -replace 'device: cuda', 'device: cpu' `
            -replace 'compute_type: int8_float16', 'compute_type: int8' `
            | Set-Content config.yaml

      - name: Generate icon
        run: python scripts/generate_icon.py

      - name: Build executable
        run: build\build_exe.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-windows
          path: |
            dist/SubtitleTranslator.exe
            config.yaml
            README.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SubtitleTranslator.exe
            config.yaml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
